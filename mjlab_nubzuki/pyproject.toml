[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "mjlab-nubzuki"
version = "0.1.0"
description = "Nubzuki locomotion training with MJLab, MuJoCo Warp, and BAM"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mjlab==1.3.0",
  "mjlab-microduck @ git+https://github.com/pollen-robotics/microduck_rl.git@29e887ecfbf5d37144759e5a9f8a176dfb83d547",
  "better-actuator-models",
  "torch==2.9.1",
  "warp-lang==1.12.0",
]

[project.entry-points."mjlab.tasks"]
mjlab_nubzuki = "mjlab_nubzuki.tasks"

[tool.uv]
override-dependencies = [
  "protobuf>=4.0,<7.0",
  "onnx>=1.20.1",
  "zmq ; python_version < '3.0'",
]

[tool.uv.sources]
better-actuator-models = { git = "https://github.com/Rhoban/bam.git", branch = "mjlab_frictionloss" }
# Keep the dependency package's aarch64-only CUDA source from leaking into
# macOS resolution. PyPI's Linux x86_64 wheel already bundles CUDA libraries.
torch = [
  { index = "pytorch-cu129", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
  { index = "pypi", marker = "sys_platform != 'linux' or platform_machine != 'aarch64'" },
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
